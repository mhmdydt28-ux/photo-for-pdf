<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محوّل الصور إلى PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f3ef;--card:#ffffff;--ink:#16202e;--mut:#647084;--line:#e4e1d8;--acc:#0f766e;--acc2:#0b5f58;--accfg:#fff;--soft:#e6f4f2;--danger:#b42318}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1419;--card:#19202a;--ink:#eaeef5;--mut:#95a1b5;--line:#2a3442;--acc:#2dd4bf;--acc2:#5eead4;--accfg:#04201c;--soft:#14302d;--danger:#f97066}}
:root[data-theme="dark"]{--bg:#0f1419;--card:#19202a;--ink:#eaeef5;--mut:#95a1b5;--line:#2a3442;--acc:#2dd4bf;--acc2:#5eead4;--accfg:#04201c;--soft:#14302d;--danger:#f97066}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:20px 14px 40px}
header{margin-bottom:18px}
h1{font-size:clamp(22px,6vw,30px);margin:0 0 4px;letter-spacing:-.3px}
.sub{margin:0;color:var(--mut);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mut);font-weight:600}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;border:2px dashed var(--line);border-radius:14px;padding:30px 14px;text-align:center;color:var(--mut);cursor:pointer;background:var(--bg);transition:.15s}
.drop.over{border-color:var(--acc);background:var(--soft);color:var(--acc)}
.drop svg{width:40px;height:40px;stroke:var(--acc)}
.drop b{color:var(--ink);font-size:17px}
.drop small{font-size:13px}
.actions{display:flex;gap:10px;margin-top:10px}
.actions .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;font-size:15px}
.actions svg{width:20px;height:20px;stroke:currentColor}
.hint{margin:10px 0 0;text-align:center;color:var(--mut);font-size:13px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.count{font-weight:700}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:40px}
.btn.pri{background:var(--soft);color:var(--acc);border-color:transparent;font-weight:600}
.btn.dng{color:var(--danger)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.th{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.pic{position:relative;aspect-ratio:1}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.num{position:absolute;top:6px;right:6px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--acc);color:var(--accfg);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.x{position:absolute;top:6px;left:6px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.mv{display:flex}
.mv button{flex:1;border:0;border-top:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 0;font-size:18px;cursor:pointer;min-height:40px}
.mv button+button{border-inline-start:1px solid var(--line)}
.mv button:disabled{opacity:.3}
.name{display:flex;align-items:stretch;direction:ltr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.name input{flex:1;min-width:0;padding:13px 14px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;outline:0;direction:auto;text-align:start}
.name:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.name span{display:flex;align-items:center;padding:0 14px;color:var(--mut);background:var(--card);border-inline-start:1px solid var(--line);font-weight:600}
.go{width:100%;padding:16px;border:0;border-radius:14px;background:var(--acc);color:var(--accfg);font:inherit;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.go svg{width:22px;height:22px;stroke:currentColor}
.go:disabled{opacity:.45;cursor:not-allowed}
.go:active:not(:disabled){background:var(--acc2)}
#msg{margin-top:12px;min-height:22px;text-align:center;color:var(--mut);font-size:14px}
.hide{display:none}
@media (max-width:420px){.thumbs{grid-template-columns:repeat(2,1fr)}main{padding:16px 12px 32px}}
</style>
</head>
<body>
<main>
  <header>
    <h1>محوّل الصور إلى PDF</h1>
    <p class="sub">أضف صورة أو أكثر، رتّبها، وسمِّ الملف، ثم حمّله بنفس مقاس وجودة صورك.</p>
  </header>

  <section class="card">
    <div class="drop" id="drop" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <b>اختر الصور</b>
      <small>اضغط للاختيار من الهاتف، أو اسحب الصور هنا. يمكنك اختيار عدة صور دفعة واحدة.</small>
    </div>
    <input id="file" type="file" accept="image/*" multiple class="hide">
    <input id="cam" type="file" accept="image/*" capture="environment" class="hide">
    <div class="actions">
      <button class="btn pri" id="camBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span>التقاط بالكاميرا</span>
      </button>
    </div>
    <p class="hint">على الكمبيوتر: يمكنك أيضًا لصق صورة من الحافظة بالضغط على Ctrl+V.</p>

    <div id="list" class="hide">
      <div class="bar" style="margin-top:16px">
        <span class="count" id="count"></span>
        <span style="display:flex;gap:8px">
          <button class="btn pri" id="more">إضافة المزيد</button>
          <button class="btn dng" id="clear">مسح الكل</button>
        </span>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>
  </section>

  <section class="card">
    <h2>اسم الملف</h2>
    <div class="name"><input id="fname" value="document" maxlength="100" autocomplete="off" aria-label="اسم الملف"><span>.pdf</span></div>
  </section>


  <button class="go" id="go" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0 4-4m-4 4-4-4"/><path d="M4 20h16"/></svg>
    <span>تحويل وتحميل PDF</span>
  </button>
  <div id="msg"></div>
</main>

<script>
const $=id=>document.getElementById(id);
let imgs=[], nameTouched=false;
$('fname').addEventListener('input',()=>nameTouched=true);

function addFiles(list){
  const files=[...list].filter(f=>f.type.startsWith('image/'));
  Promise.all(files.map(f=>new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>res({name:f.name,url:r.result,type:f.type});
    r.onerror=()=>res(null);
    r.readAsDataURL(f);
  }))).then(rs=>{imgs.push(...rs.filter(Boolean));render();});
}
function render(){
  $('list').classList.toggle('hide',!imgs.length);
  $('count').textContent=imgs.length===1?'صورة واحدة':imgs.length+' صور';
  const t=$('thumbs');t.innerHTML='';
  imgs.forEach((im,i)=>{
    const d=document.createElement('div');d.className='th';
    const pic=document.createElement('div');pic.className='pic';
    const p=document.createElement('img');p.src=im.url;p.alt='';
    const n=document.createElement('span');n.className='num';n.textContent=i+1;
    const x=document.createElement('button');x.className='x';x.textContent='×';x.setAttribute('aria-label','حذف');
    x.onclick=()=>{imgs.splice(i,1);render();};
    pic.append(p,n,x);
    const mv=document.createElement('div');mv.className='mv';
    const a=document.createElement('button');a.textContent='›';a.setAttribute('aria-label','تقديم');a.disabled=i===0;
    a.onclick=()=>{[imgs[i-1],imgs[i]]=[imgs[i],imgs[i-1]];render();};
    const b=document.createElement('button');b.textContent='‹';b.setAttribute('aria-label','تأخير');b.disabled=i===imgs.length-1;
    b.onclick=()=>{[imgs[i+1],imgs[i]]=[imgs[i],imgs[i+1]];render();};
    mv.append(a,b);
    d.append(pic,mv);t.append(d);
  });
  if(!nameTouched && imgs.length){
    $('fname').value=imgs.length===1?(imgs[0].name.replace(/\.[^.]+$/,'')||'document'):'document';
  }
  $('go').disabled=!imgs.length;
}
const drop=$('drop');
const pick=()=>$('file').click();
drop.onclick=pick;
drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}};
$('more').onclick=pick;
$('clear').onclick=()=>{imgs=[];render();};
$('camBtn').onclick=()=>$('cam').click();
$('cam').onchange=e=>{addFiles(e.target.files);e.target.value='';};
document.addEventListener('paste',e=>{
  const fs=[...(e.clipboardData?e.clipboardData.files:[])].filter(f=>f.type.startsWith('image/'));
  if(fs.length){e.preventDefault();addFiles(fs);$('msg').textContent='تمت إضافة الصورة الملصوقة.';}
});
$('file').onchange=e=>{addFiles(e.target.files);e.target.value='';};
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));

const loadImg=u=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u;});
function cleanName(){
  const n=$('fname').value.trim().replace(/\.pdf$/i,'').replace(/[\\/:*?"<>|]/g,'-');
  return (n||'document')+'.pdf';
}
async function build(){
  const {jsPDF}=window.jspdf;
  let pdf=null;
  for(const im of imgs){
    const i=await loadImg(im.url);
    const w=i.naturalWidth, h=i.naturalHeight;
    // full original resolution; PNG stays lossless, other formats saved at max JPEG quality
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d');
    const png=im.type==='image/png';
    if(!png){x.fillStyle='#fff';x.fillRect(0,0,w,h);}
    x.drawImage(i,0,0,w,h);
    const data=png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',1);
    const pw=w*0.75, ph=h*0.75, o=w>h?'l':'p';
    if(!pdf){pdf=new jsPDF({orientation:o,unit:'pt',format:[pw,ph],compress:true});}
    else{pdf.addPage([pw,ph],o);}
    pdf.addImage(data,png?'PNG':'JPEG',0,0,pw,ph,undefined,'NONE');
    c.width=c.height=0;
  }
  return pdf.output('blob');
}
$('go').onclick=async()=>{
  const msg=$('msg');msg.textContent='جارٍ التحويل...';$('go').disabled=true;
  try{
    const blob=await build(), filename=cleanName();
    let dl=null;try{dl=await claude.use('downloads');}catch(e){}
    if(dl){
      try{await dl.save({filename,data:blob});msg.textContent='تم تجهيز الملف: '+filename;}
      catch(e){msg.textContent=e&&e.code==='declined'?'تم إلغاء التحميل.':'تعذّر الحفظ، حاول مرة أخرى.';}
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
      document.body.append(a);a.click();a.remove();msg.textContent='تم تجهيز الملف: '+filename;
    }
  }catch(e){msg.textContent='حدث خطأ أثناء التحويل. جرّب عددًا أقل من الصور.';}
  $('go').disabled=!imgs.length;
};
</script>
</body>
</html>
